[project]
name = "gridlock-triage"
version = "0.1.0"
description = "GridLock triage engine: one tier and a grounded reason per report, never an invented one."
requires-python = ">=3.13"
# Pinned exactly. aio-pika, psycopg and httpx (triage.md section 7) join with the consumer
# (T021/T030) and the rag-index client (T032), the tickets that first import them.
dependencies = [
    "gridlock-contracts",
    "langchain-core==1.6.9",
    "pydantic==2.14.0",
]

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[tool.uv.sources]
gridlock-contracts = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridlock_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["gridlock_contracts", "gridlock_triage"]

[tool.pyright]
pythonVersion = "3.13"
include = ["src", "tests"]
typeCheckingMode = "strict"
