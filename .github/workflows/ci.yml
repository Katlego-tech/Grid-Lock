# CI -- the backstop for the local pre-push gate.
#
# The local hook is opt-in (core.hooksPath is not cloned) and bypassable (--no-verify),
# so it is the fast feedback loop, not the authority. This is the authority: it runs on
# hardware nobody can configure their way around.
#
# It deliberately runs the SAME scripts/gate.sh the hook runs. Do not add checks here
# that the hook doesn't have -- add them to gate.sh and both get them. A pipeline that
# has drifted from the local gate teaches people to ignore the local gate.
#
# Toolchain versions below are pinned to what the project targets: Python 3.13, Node 24 LTS.
# Keep them in step with the project's pinned runtimes. Dependencies are installed through
# gate.sh itself, and everything from there on is meant to stay as it is.

name: CI

# Pushes run on main only; a branch gets the gate through its PR. Running on pushes to
# every branch as well ran it twice for each commit on a branch with an open PR -- one run
# for the push, one for the PR, in different concurrency groups, so neither cancelled the other.
#
# `edited` is in the list because retargeting a stacked PR onto main is an edit, and GitHub starts
# nothing for it otherwise. A title or description edit reruns the gate too, which costs minutes
# but can't let anything through.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# A new push to a branch replaces the run it makes stale. Never on main: there, the second of two
# quick merges would cancel the first merge's check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Every commit. The change set below is a diff between two of them, and the gate's
          # secret history scan reads them all: on a shallow clone it refuses to run.
          fetch-depth: 0

      # --- what changed -----------------------------------------------------
      # Done first, because a change that touches nothing but the status board and the AI entry
      # points has nothing to check, and every step below is skipped for it. This is deliberately
      # not `paths-ignore`: a workflow ignored that way reports no status at all, so a required
      # `gate` check would wait forever and that PR could never merge. Skipped steps still report
      # a green `gate`.
      #
      # The diff is from the merge-base, as in the pre-push hook, so CI and the hook sweep the
      # same files. Names are read with -z, as there: git otherwise quotes a name holding a
      # double quote, a backslash or a tab, and a quoted name matches no file for the sweeps.
      #
      # 📝 Customize: add a file to the board list only after `git grep -n <name> -- ':!*.md'`
      # comes back empty. Never add all of **.md or docs/ -- gates and tests read design docs,
      # and Secret Realm's trace check reads TASKS.md.
      - name: Compute the change set
        id: changes
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          base=""
          head="$SHA"
          if [ "$EVENT" = "pull_request" ]; then
            head="$PR_HEAD"
            base="$(git merge-base "$PR_BASE" "$PR_HEAD")"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          fi
          if [ -n "$base" ]; then
            git diff -z --name-only --diff-filter=ACMR "$base..$head" > /tmp/changed.z
            # Everything touched, deletions and both sides of a rename included.
            git diff -z --name-only --no-renames "$base..$head" > /tmp/touched.z
          else
            git ls-tree -r -z --name-only "$head" > /tmp/changed.z
            cp /tmp/changed.z /tmp/touched.z
          fi
          # The gate takes one name per line, which a name holding a line break cannot survive.
          # Only what the change adds or keeps is refused: a change that deletes or renames such
          # a file is the fix, and it must be able to pass.
          one_per_line() {
            [ "$(LC_ALL=C tr -cd '\0' < "$1" | wc -c)" -eq "$(LC_ALL=C tr '\0' '\n' < "$1" | wc -l)" ]
          }
          if ! one_per_line /tmp/changed.z; then
            echo "::error::A file name in this change holds a line break, so the sweeps cannot list it. Rename it."
            exit 1
          fi
          LC_ALL=C tr '\0' '\n' < /tmp/changed.z > /tmp/changed.txt
          LC_ALL=C tr '\0' '\n' < /tmp/touched.z > /tmp/touched.txt
          echo "$(wc -l < /tmp/changed.txt) file(s) in the change set"
          board_only=false
          # A touched name holding a line break reads as two names here, so it is never board-only.
          if one_per_line /tmp/touched.z && [ -s /tmp/touched.txt ] \
             && ! grep -Evq '^(STATUS\.md|HANDOFF\.md|CLAUDE\.md|GEMINI\.md|\.claude/.*)$' /tmp/touched.txt; then
            board_only=true
            echo "Only the status board and AI entry points changed, so the gate has nothing to check."
          fi
          echo "board_only=$board_only" >> "$GITHUB_OUTPUT"

      # --- toolchain -------------------------------------------------------
      # Pinned, not "latest". An unpinned toolchain turns an unrelated upstream
      # release into a red build on a branch that changed nothing. Every action
      # here runs on Node 24; the Node 20 versions they replace are deprecated.
      - name: Set up Python
        if: steps.changes.outputs.board_only != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      # setup-uv stopped publishing major tags (like @v10) in v8, so it is pinned
      # to a full release. Bump it deliberately; there is no tag that moves for you.
      - name: Set up uv
        if: steps.changes.outputs.board_only != 'true'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: '0.11.32'
          enable-cache: true

      - name: Set up Node
        if: steps.changes.outputs.board_only != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24.21.0'
          # Since v5 this action caches npm dependencies on its own when package.json
          # names npm as the package manager. Not here: the install goes through gate.sh
          # -- keep it that way. "Cache downloads" below caches what the install fetches.
          package-manager-cache: false

      # Only a project with a pom.xml gets a JDK; the gate then runs `mvn verify` in it.
      # 📝 Customize: the Java version PLAN.md pins.
      - name: Set up Java
        if: steps.changes.outputs.board_only != 'true' && hashFiles('**/pom.xml') != ''
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      # pnpm and yarn come with Node through corepack; this puts them on PATH, so a
      # project locked with pnpm-lock.yaml or yarn.lock installs and runs with the
      # manager it was locked with. (bun.lockb needs oven-sh/setup-bun -- add it here.)
      - name: Enable pnpm and yarn
        if: steps.changes.outputs.board_only != 'true'
        run: corepack enable

      # The gate's vulnerability scan checks every lockfile against the OSV database.
      # A pinned release, verified against its published checksum before it runs.
      - name: Set up osv-scanner
        if: steps.changes.outputs.board_only != 'true'
        shell: bash
        env:
          OSV_SCANNER_VERSION: v2.5.1
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/google/osv-scanner/releases/download/$OSV_SCANNER_VERSION"
          curl --retry 3 --retry-all-errors -sSfLO "$base/osv-scanner_linux_amd64"
          curl --retry 3 --retry-all-errors -sSfLO "$base/osv-scanner_SHA256SUMS"
          grep ' osv-scanner_linux_amd64$' osv-scanner_SHA256SUMS | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          install -m 0755 osv-scanner_linux_amd64 "$HOME/.local/bin/osv-scanner"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The gate's secret history scan reads every commit with gitleaks. A pinned release,
      # verified the same way.
      - name: Set up gitleaks
        if: steps.changes.outputs.board_only != 'true'
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --retry 3 --retry-all-errors -sSfLO "$base/$tarball"
          curl --retry 3 --retry-all-errors -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          mkdir -p "$HOME/.local/bin"
          install -m 0755 gitleaks "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Only a project locked with pnpm has a pnpm store worth caching; asking pnpm for its
      # path anywhere else would fetch pnpm for nothing.
      - name: Find the pnpm store
        if: steps.changes.outputs.board_only != 'true'
        id: pnpm-store
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          lock="$(git ls-files '*pnpm-lock.yaml' | head -n 1)"
          if [ -n "$lock" ]; then
            echo "path=$(cd "$(dirname "$lock")" && pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          fi

      # Caches what the installs download, never what they install: gate.sh still runs
      # every install, so a hit only means less comes over the network. uv's cache is
      # set-up-uv's (above). The key is the lockfiles, so a dependency change starts a fresh
      # cache from the nearest old one. A project with no Node lockfile or pom.xml caches
      # nothing.
      - name: Cache downloads
        if: steps.changes.outputs.board_only != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.npm
            ~/.m2/repository
            ~/.cache/ms-playwright
            ${{ steps.pnpm-store.outputs.path }}
          key: downloads-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/pnpm-lock.yaml', '**/yarn.lock', '**/pom.xml') }}
          restore-keys: downloads-${{ runner.os }}-

      # --- dependencies ----------------------------------------------------
      # gate.sh treats "dependencies not installed" as a failure, so this step is
      # what makes it able to run rather than able to complain. It goes through
      # gate.sh on purpose: the installer walks the same directories and picks the
      # same package manager as the checks do. This used to be a loop here with its
      # own directory list, and CI stopped installing folders the gate still checked.
      - name: Install dependencies
        if: steps.changes.outputs.board_only != 'true'
        run: bash scripts/gate.sh --install-deps

      # --- the gate --------------------------------------------------------
      - name: Run the gate
        if: steps.changes.outputs.board_only != 'true'
        run: bash scripts/gate.sh --changed-files /tmp/changed.txt
