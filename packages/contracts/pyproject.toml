[project]
name = "gridlock-contracts"
version = "0.1.0"
description = "GridLock's shared contracts: the enums, payload models, message routing and grid cell function every service imports."
requires-python = ">=3.13"
dependencies = [
    "h3==4.5.0",
    "pydantic==2.14.0",
]

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gridlock_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# domain-model.md section 6 declares the enums as `class Tier(str, Enum)`, verbatim.
"gridlock_contracts/enums.py" = ["UP042"]

[tool.ruff.lint.isort]
known-first-party = ["gridlock_contracts"]

[tool.pyright]
pythonVersion = "3.13"
include = ["gridlock_contracts", "scripts", "tests"]
typeCheckingMode = "strict"
